<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Achat billet - THE LAST</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">

  <div class="bg-white shadow-lg rounded-lg p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold text-green-600 mb-6 text-center">Finaliser ton achat</h1>

    <form id="checkoutForm" class="space-y-4">
      <input type="hidden" id="ticketType" name="type" />

      <div>
        <label class="block text-sm font-medium">Prénom</label>
        <input type="text" id="firstName" required class="w-full border rounded p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium">Nom</label>
        <input type="text" id="lastName" required class="w-full border rounded p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium">Email</label>
        <input type="email" id="email" required class="w-full border rounded p-2" />
      </div>

      <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded">
        Payer maintenant
      </button>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get("type") || "INDIVIDUEL";
    document.getElementById("ticketType").value = type;

    document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const buyer = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        email: document.getElementById("email").value,
      };

      const res = await fetch("/api/checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type, buyer }),
      });

      const data = await res.json();
      if (data.url) {
        window.location.href = data.url;
      } else {
        alert("Erreur lors de la création du paiement : " + data.error);
      }
    });
  </script>
</body>
</html>
