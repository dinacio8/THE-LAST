<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - THE LAST</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<header class="bg-white shadow p-4 flex justify-between items-center sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <img src="terrain_GE_gvapaintball_01.png" class="h-10" alt="logo">
    <h1 class="text-2xl font-bold text-green-600">ADMIN - THE LAST</h1>
  </div>
  <button id="exportExcel" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md">
    📊 Export Excel
  </button>
</header>

<main class="p-6 overflow-x-auto">
  <table class="min-w-full bg-white border border-gray-200 rounded-lg shadow-sm">
    <thead class="bg-green-600 text-white">
      <tr>
        <th class="py-2 px-3">ID</th>
        <th class="py-2 px-3">Nom</th>
        <th class="py-2 px-3">Email</th>
        <th class="py-2 px-3">Type</th>
        <th class="py-2 px-3">Prix</th>
        <th class="py-2 px-3">Statut</th>
        <th class="py-2 px-3">Date</th>
        <th class="py-2 px-3">Billet</th>
        <th class="py-2 px-3">Facture</th>
      </tr>
    </thead>
    <tbody id="ordersBody" class="divide-y divide-gray-100 text-sm"></tbody>
  </table>
</main>

<script>
async function loadOrders() {
  const res = await fetch("/api/admin-orders");
  const data = await res.json();
  const tbody = document.getElementById("ordersBody");

  tbody.innerHTML = data.map(order => `
    <tr>
      <td class="py-2 px-3 text-center">${order.id}</td>
      <td class="py-2 px-3">${order.first_name} ${order.last_name}</td>
      <td class="py-2 px-3">${order.email}</td>
      <td class="py-2 px-3 text-center">${order.type}</td>
      <td class="py-2 px-3 text-center">${order.price} CHF</td>
      <td class="py-2 px-3 text-center">${order.status}</td>
      <td class="py-2 px-3 text-center">${new Date(order.created_at).toLocaleString("fr-CH")}</td>
      <td class="py-2 px-3 text-center">
        <a href="/api/download-pdf?id=${order.id}&type=ticket" class="text-green-600 hover:underline">🎟</a>
      </td>
      <td class="py-2 px-3 text-center">
        <a href="/api/download-pdf?id=${order.id}&type=invoice" class="text-yellow-600 hover:underline">📄</a>
      </td>
    </tr>
  `).join("");
}

document.getElementById("exportExcel").addEventListener("click", () => {
  window.location.href = "/api/export-orders";
});

loadOrders();
</script>
</body>
</html>
