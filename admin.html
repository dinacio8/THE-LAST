<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - THE LAST</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

  <!-- PAGE DE CONNEXION -->
  <div id="loginPage" class="flex flex-col justify-center items-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-sm w-full text-center">
      <img src="terrain_GE_gvapaintball_01.png" alt="logo" class="h-16 mx-auto mb-4">
      <h2 class="text-2xl font-bold text-green-600 mb-4">Accès administrateur</h2>
      <input type="password" id="adminPass" placeholder="Mot de passe" class="border border-gray-300 rounded-md w-full p-2 mb-4">
      <button id="loginBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-md">Connexion</button>
      <p id="loginError" class="text-red-500 text-sm mt-3 hidden">Mot de passe incorrect</p>
    </div>
  </div>

  <!-- PAGE ADMIN -->
  <div id="adminPage" class="hidden">
    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <img src="terrain_GE_gvapaintball_01.png" alt="logo" class="h-10">
        <h1 class="text-2xl font-bold text-green-600">ADMIN - THE LAST</h1>
      </div>
      <div class="flex items-center gap-3">
        <button id="exportExcel" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md">
          📊 Export Excel
        </button>
        <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md">
          🚪 Déconnexion
        </button>
      </div>
    </header>

    <main class="p-6 overflow-x-auto">
      <h2 class="text-2xl font-bold text-center text-green-600 mb-6">Liste des commandes</h2>
      <table class="min-w-full bg-white border border-gray-200 rounded-lg shadow-sm text-sm">
        <thead class="bg-green-600 text-white">
          <tr>
            <th class="py-2 px-3">ID</th>
            <th class="py-2 px-3">Nom</th>
            <th class="py-2 px-3">Email</th>
            <th class="py-2 px-3">Prix</th>
            <th class="py-2 px-3">Statut</th>
            <th class="py-2 px-3">Date</th>
            <th class="py-2 px-3">Billet</th>
            <th class="py-2 px-3">Facture</th>
          </tr>
        </thead>
        <tbody id="ordersBody" class="divide-y divide-gray-100"></tbody>
      </table>
    </main>
  </div>

  <script>
    const PASSWORD = "GvaPaintball2025."; // 🔒 Change si besoin

    const loginPage = document.getElementById("loginPage");
    const adminPage = document.getElementById("adminPage");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const loginError = document.getElementById("loginError");

    // ✅ Auth basique
    loginBtn.addEventListener("click", () => {
      const entered = document.getElementById("adminPass").value;
      if (entered === PASSWORD) {
        localStorage.setItem("isAdmin", "true");
        showAdmin();
      } else {
        loginError.classList.remove("hidden");
      }
    });

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("isAdmin");
      adminPage.classList.add("hidden");
      loginPage.classList.remove("hidden");
    });

    function showAdmin() {
      loginPage.classList.add("hidden");
      adminPage.classList.remove("hidden");
      loadOrders();
    }

    if (localStorage.getItem("isAdmin") === "true") {
      showAdmin();
    }

    // ✅ Charger les commandes
    async function loadOrders() {
      const res = await fetch("/api/admin-orders");
      const data = await res.json();
      const tbody = document.getElementById("ordersBody");

      tbody.innerHTML = data.map(order => `
        <tr>
          <td class="py-2 px-3 text-center">${order.id}</td>
          <td class="py-2 px-3">${order.first_name} ${order.last_name}</td>
          <td class="py-2 px-3">${order.email}</td>
          <td class="py-2 px-3 text-center">${order.price.toFixed(2)} CHF</td>
          <td class="py-2 px-3 text-center">${order.status}</td>
          <td class="py-2 px-3 text-center">${new Date(order.created_at).toLocaleString("fr-CH")}</td>
          <td class="py-2 px-3 text-center">
            <a href="/api/download-pdf?id=${order.id}&type=ticket" class="text-green-600 hover:underline">🎟 Télécharger</a>
          </td>
          <td class="py-2 px-3 text-center">
            <a href="/api/download-pdf?id=${order.id}&type=invoice" class="text-yellow-600 hover:underline">📄 Télécharger</a>
          </td>
        </tr>
      `).join("");
    }

    // ✅ Export Excel
    document.getElementById("exportExcel").addEventListener("click", () => {
      window.location.href = "/api/export-orders";
    });
  </script>
</body>
</html>
